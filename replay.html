<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>璀璨宝石 · 逐步回放</title><link rel="stylesheet" href="./replay.css"><script type="module" src="./browser-client.js"></script></head>
<body><header><div><small>SPLENDOR LAB / REPLAY</small><h1>对战逐步回放</h1></div><a href="./">返回对战</a></header>
<div class="tools"><button id="current">读取浏览器记录</button><label class="file">打开历史 JSON <input id="file" type="file" accept=".json,application/json"></label><a href="#" data-download-record>导出浏览器记录</a></div>
<p id="meta"></p><p class="muted">回放展示每个动作执行后的公开棋盘。盲抽预留保持隐藏；你正在玩的对局不会因回放而改变。进行中的新动作需点击「读取浏览器记录」更新。</p><p id="error" role="alert"></p>
<section class="transport"><div class="tools"><button id="first" disabled>回到开局</button><button id="prev" disabled>上一步</button><button id="play" disabled>播放</button><button id="next" disabled>下一步</button><button id="last" disabled>最后一步</button><label>速度 <select id="speed"><option value="1600">慢速</option><option value="900" selected>正常</option><option value="400">快速</option></select></label><strong id="position">尚未加载</strong></div><input id="step" type="range" min="0" max="0" value="0" disabled aria-label="回放进度"><div id="description" aria-live="polite"></div></section>
<main><div><section><h2>本步涉及的卡牌</h2><div id="focus" class="focus muted">开局</div></section><section><h2>市场与贵族</h2><div id="market"></div><div id="nobles"></div><p id="bank"></p></section><section><h2>玩家资产</h2><div id="players" class="players"></div></section></div><aside><h2>动作条 · 点击跳转</h2><div id="timeline" role="list" aria-label="动作时间线"></div></aside></main></body></html>
